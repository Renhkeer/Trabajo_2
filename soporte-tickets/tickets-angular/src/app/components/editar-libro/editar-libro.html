<section class="formulario">
  <h2>Editar libro</h2>

  @if (cargando) { <p>Cargando información...</p> }
  @if (error) { <p class="error">{{ error }}</p> }

  @if (!cargando && !error) {
    <form [formGroup]="formulario" (ngSubmit)="guardar()">
      <label for="titulo">Título</label>
      <input id="titulo" type="text" formControlName="titulo">

      <label for="autor">Autor</label>
      <input id="autor" type="text" formControlName="autor">

      <label for="categoria">Categoría</label>
      <input id="categoria" type="text" formControlName="categoria">

      <label for="editorial">Editorial</label>
      <input id="editorial" type="text" formControlName="editorial">

      <label for="anio">Año</label>
      <input id="anio" type="number" formControlName="anio">

      <label class="check">
        <input type="checkbox" formControlName="disponible"> Libro disponible
      </label>

      <div class="botones">
        <button type="submit">Guardar cambios</button>
        <button class="secundario" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  }
</section>
